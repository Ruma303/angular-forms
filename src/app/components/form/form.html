<h2>Template-driven forms</h2>

<form #myForm="ngForm" (ngSubmit)="submitForm(myForm)" class="form">
  <label for="username">Username: <span>{{ username }}</span></label>
  <input [(ngModel)]="username" name="username">
  <label for="email">Email: <span>{{ email }}</span></label>
  <input [(ngModel)]="email" name="email">
  <button type="submit" [disabled]="myForm.invalid">Invia</button>
</form>

@if(submitted) {
  <div>
    <h3>Form submitted</h3>
    <p>Username: {{ form.username }}</p>
    <p>Email: {{ form.email }}</p>
  </div>
}
